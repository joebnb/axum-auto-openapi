[package]
name = "axum-auto-openapi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Zero-annotation OpenAPI 3.1 generation for Axum 0.8"
repository = "https://github.com/joebnb/axum-auto-openapi"
readme = "README.md"
keywords = ["axum", "openapi", "schema", "http", "web"]
categories = ["web-programming::http-server"]

[features]
default = []
# Serve a Swagger UI page backed by a generated OpenAPI JSON route.
swagger-ui = []

[dependencies]
axum = "0.8"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"

[dev-dependencies]
oas3 = { version = "0.22", default-features = false }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
trybuild = "1"
